<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AI-OS.NET animated operating system logo</title>
  <desc id="desc">A stylized geometric octopus — AIOS's mascot — with a rounded mantle, a neural core marker, and curling tentacles, orbited by neural ring accents.</desc>
  <style>
    .glow {
      animation: pulse 4.8s ease-in-out infinite;
    }

    .ring {
      animation: spin 26s linear infinite;
      transform-box: view-box;
      transform-origin: 256px 256px;
    }

    .ring.reverse {
      animation-duration: 38s;
      animation-direction: reverse;
    }

    .node {
      animation: node-pulse 2.4s ease-in-out infinite;
    }

    .node:nth-child(2n) {
      animation-delay: 800ms;
    }

    .octopus {
      animation: breathe 5.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 256px 260px;
    }

    .eye-pupil {
      animation: blink 5.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }

    .eye-pupil:nth-child(2n) {
      animation-delay: 120ms;
    }

    @keyframes pulse {
      0%, 100% { opacity: .48; transform: scale(.98); }
      50% { opacity: .92; transform: scale(1.02); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes node-pulse {
      0%, 100% { opacity: .55; r: 4; }
      50% { opacity: 1; r: 5.5; }
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.012); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>

  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#ce2867" stop-opacity=".46" />
      <stop offset="52%" stop-color="#a855f7" stop-opacity=".18" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentStroke" x1="88" y1="104" x2="424" y2="428">
      <stop offset="0%" stop-color="#ce2867" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="mantleFill" x1="150" y1="118" x2="362" y2="330">
      <stop offset="0%" stop-color="#ce2867" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.807 0 1 0 0 0.157 0 0 1 0 0.404 0 0 0 .58 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#09090b" />
  <circle class="glow" cx="256" cy="244" r="210" fill="url(#coreGlow)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentStroke)" stroke-width="1.5" opacity=".42" />
  <circle cx="256" cy="256" r="142" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 12" opacity=".16" />

  <g class="ring" fill="none" stroke="url(#accentStroke)" stroke-linecap="round" filter="url(#softGlow)" opacity=".68">
    <path d="M96 254C146 114 360 98 416 254" stroke-width="2.2" stroke-dasharray="24 18" />
    <path d="M120 344C182 420 330 420 392 344" stroke-width="1.6" stroke-dasharray="10 16" />
    <circle class="node" cx="116" cy="206" r="4" fill="#ce2867" stroke="none" />
    <circle class="node" cx="396" cy="206" r="4" fill="#a855f7" stroke="none" />
    <circle class="node" cx="164" cy="394" r="4" fill="#ce2867" stroke="none" />
    <circle class="node" cx="348" cy="394" r="4" fill="#a855f7" stroke="none" />
  </g>

  <g class="ring reverse" fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".2">
    <path d="M80 292C150 380 362 382 432 292" stroke-width="1.4" stroke-dasharray="4 18" />
    <path d="M118 154C188 74 326 74 394 154" stroke-width="1.2" stroke-dasharray="4 20" />
  </g>

  <g class="octopus">
    <ellipse cx="256" cy="440" rx="118" ry="16" fill="#000000" opacity=".3" />

    <!-- tentacles (drawn first so the mantle overlaps their roots) -->
    <g fill="none" stroke="url(#accentStroke)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M196 292C150 320 120 360 130 410C136 440 165 452 190 438" stroke-width="20" opacity=".92" />
      <path d="M222 298C205 340 195 380 205 415C210 435 230 442 246 432" stroke-width="17" opacity=".88" />
      <path d="M244 300C238 330 236 355 244 375" stroke-width="14" opacity=".84" />
      <path d="M268 300C274 330 276 355 268 375" stroke-width="14" opacity=".84" />
      <path d="M290 298C307 340 317 380 307 415C302 435 282 442 266 432" stroke-width="17" opacity=".88" />
      <path d="M316 292C362 320 392 360 382 410C376 440 347 452 322 438" stroke-width="20" opacity=".92" />
    </g>
    <circle class="node" cx="190" cy="438" r="4.5" fill="#ce2867" />
    <circle class="node" cx="322" cy="438" r="4.5" fill="#a855f7" />
    <circle class="node" cx="246" cy="432" r="3.5" fill="#ce2867" />
    <circle class="node" cx="266" cy="432" r="3.5" fill="#a855f7" />

    <!-- mantle / head -->
    <path d="M256 118C330 118 366 168 362 232C360 268 344 292 316 300L196 300C168 292 152 268 150 232C146 168 182 118 256 118Z" fill="url(#mantleFill)" />
    <ellipse cx="256" cy="168" rx="72" ry="38" fill="#ffffff" opacity=".07" />

    <!-- neural core marker -->
    <polygon points="256,126 269,133 269,148 256,155 243,148 243,133" fill="#0a0a0a" opacity=".5" />
    <polygon points="256,128 268,134.5 268,147.5 256,154 244,147.5 244,134.5" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".6" />
    <circle cx="256" cy="141" r="3" fill="#ffffff" opacity=".9" />

    <!-- eyes -->
    <circle cx="214" cy="210" r="23" fill="#f5f5f5" />
    <circle cx="298" cy="210" r="23" fill="#f5f5f5" />
    <g class="eye-pupil">
      <circle cx="214" cy="210" r="10" fill="#09090b" />
      <circle cx="217" cy="207" r="3" fill="#ffffff" />
    </g>
    <g class="eye-pupil">
      <circle cx="298" cy="210" r="10" fill="#09090b" />
      <circle cx="301" cy="207" r="3" fill="#ffffff" />
    </g>

    <!-- mouth -->
    <path d="M240 252C247 259 265 259 272 252" fill="none" stroke="#09090b" stroke-width="4" stroke-linecap="round" opacity=".55" />
  </g>
</svg>
