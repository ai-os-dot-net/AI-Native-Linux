# AI-OS.NET GitLab CI/CD — Revision 12
# Push target: gitlab remote (http://192.168.1.180)
# Mirror: GitHub backup repository only; GitHub Actions are disabled.

stages:
  - check
  - test
  - lint
  - build
  - assemble
  - verify

# Superseded pipelines are auto-canceled (project setting) — interruptible
# lets that apply to already-running jobs too, so stale build containers
# don't pile up on the runner disk.
default:
  interruptible: true

variables:
  # Fast cache archiver — default zip took 45+ min on the ~60k-file target/ tree
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTUP_HOME: "/usr/local/rustup"
  RUST_VERSION: "1.94"
  AIOS_RUST_CI_IMAGE: "192.168.1.180:5050/platform/ci-templates/neurocad-ci-tools:latest"
  RUSTC_BOOTSTRAP: "0"
  DEBIAN_FRONTEND: "noninteractive"
  # ISO naming convention: aios-rev12-<short-sha>-x86_64.iso
  ISO_NAME: "aios-rev12-${CI_COMMIT_SHORT_SHA}-x86_64"
  ISO_OUTPUT: "distro/build/${ISO_NAME}.iso"
  OPENSUSE_CI_IMAGE: "opensuse/leap:16.0"
  AIOS_OPENSUSE_RELEASE: "16.0"
  AIOS_OPENSUSE_ARCH: "x86_64"
  AIOS_OPENSUSE_PACKAGE_SET: "server"
  AIOS_R13_ENTERPRISE_BUILD: "0"
  AIOS_R13_QEMU_BOOT_TEST: "0"
  R13_ISO_NAME: "aios-r13-${CI_COMMIT_SHORT_SHA}-${AIOS_OPENSUSE_ARCH}"
  R13_ISO_OUTPUT: "distro/build/${R13_ISO_NAME}.iso"
  R13_ROOTFS_DIR: "distro/build/out/rootfs-opensuse-leap-${AIOS_OPENSUSE_RELEASE}-${AIOS_OPENSUSE_ARCH}"
  R13_ROOTFS_TARBALL: "distro/build/out/rootfs-opensuse-leap-${AIOS_OPENSUSE_RELEASE}-${AIOS_OPENSUSE_ARCH}.tar.gz"

# Shared Rust cache — cargo registry, git checkouts, build artifacts
.cargo_cache: &cargo_cache
  cache:
    key: "${CI_COMMIT_REF_SLUG}-cargo"
    when: "always"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

# Shared build-dependency bootstrap for Rust workspace jobs
.bootstrap_deps: &bootstrap_deps
  before_script:
    - rustc --version
    - cargo --version
    - c++ --version
    # neurocad-ci-tools lacks protoc (tonic) and libclang (rocksdb-sys bindgen
    # for crates/aios-evidence, crates/aios-vault) — install on demand.
    - >
      (command -v protoc >/dev/null 2>&1 && ldconfig -p | grep -q libclang) ||
      (apt-get update -qq && apt-get install -y -qq protobuf-compiler libclang-dev clang)
    - protoc --version

# ==========================================================================
# STAGE 1 — CHECK (fast gate: catches compilation errors early)
# ==========================================================================
cargo-check:
  stage: check
  image: ${AIOS_RUST_CI_IMAGE}
  <<: *cargo_cache
  <<: *bootstrap_deps
  script:
    - cargo check --workspace --locked
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==========================================================================
# STAGE 2 — TEST (depends on check)
# ==========================================================================
cargo-test:
  stage: test
  image: ${AIOS_RUST_CI_IMAGE}
  # 7k tests + test-binary builds share the runner with the rootfs job
  timeout: 2h
  <<: *cargo_cache
  <<: *bootstrap_deps
  needs:
    - cargo-check
  script:
    - cargo test --workspace --no-fail-fast
  artifacts:
    when: always
    reports:
      junit: target/test-results.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

distro-shell-tests:
  stage: test
  image: ${AIOS_RUST_CI_IMAGE}
  # metadata gate does a scaffold debug build — reuse the cargo cache
  cache:
    key: "${CI_COMMIT_REF_SLUG}-cargo"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  timeout: 2h
  before_script:
    # neurocad-ci-tools lacks shellcheck — install on demand
    - command -v shellcheck >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq shellcheck)
    - shellcheck --version
  script:
    # -S warning: info/style findings (e.g. SC2317 trap-invoked functions) don't block
    - shellcheck -S warning
      distro/build/build-aios-iso.sh
      distro/build/build-opensuse-rootfs.sh
      distro/build/ci-build-all.sh
      distro/build/qemu-boot-smoke.sh
      distro/build/tests/test-rev13-opensuse-base.sh
      distro/build/tests/test-rev12-boot-gate.sh
      distro/build/tests/test-rev12-release-metadata.sh
      distro/build/tests/test-rev12-installer.sh
      distro/build/tests/test-rev12-kernel-pipeline.sh
      distro/build/tests/test-rev12-repo-update.sh
      distro/build/tests/test-rev12-security-baseline.sh
      distro/build/tests/test-rev12-distribution-gates.sh
      distro/repo/aios-repo-publish.sh
      distro/update/aios-update.sh
      distro/installer/aios-quick-install.sh
      distro/installer/aios-installer.sh
      distro/installer/aios-autoinstall.sh
      distro/build/qemu-install-test.sh
      distro/build/tests/test-rev12-install-gate.sh
      distro/build/tests/test-rev12-negative-gates.sh
      distro/build/tests/test-rev12-release-update-gate.sh
      distro/build/tests/test-rev12-uefi-boot-gate.sh
    - bash distro/build/tests/test-rev11-build.sh
    - bash distro/build/tests/test-rev12-uefi-boot-gate.sh
    - bash distro/build/tests/test-rev12-install-gate.sh
    - bash distro/build/tests/test-rev12-negative-gates.sh
    # full release-update cycle needs its own scaffold build — static layer here,
    # the real cycle runs in the verify stage against assemble-iso artifacts later
    - AIOS_RELEASE_UPDATE_GATE=0 bash distro/build/tests/test-rev12-release-update-gate.sh
    - bash distro/build/tests/test-rev12-boot-gate.sh
    - bash distro/build/tests/test-rev12-release-metadata.sh
    - bash distro/build/tests/test-rev12-installer.sh
    - bash distro/build/tests/test-rev12-kernel-pipeline.sh
    - bash distro/build/tests/test-rev12-repo-update.sh
    - bash distro/build/tests/test-rev12-security-baseline.sh
    - bash distro/build/tests/test-rev12-distribution-gates.sh
    - bash distro/build/tests/test-rev13-opensuse-base.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==========================================================================
# STAGE 3 — LINT (clippy + rustfmt, parallel)
# ==========================================================================
cargo-clippy:
  stage: lint
  image: ${AIOS_RUST_CI_IMAGE}
  <<: *cargo_cache
  <<: *bootstrap_deps
  needs:
    - cargo-check
  before_script:
    # NB: this before_script OVERRIDES bootstrap_deps — repeat the dep install
    - >
      (command -v protoc >/dev/null 2>&1 && ldconfig -p | grep -q libclang) ||
      (apt-get update -qq && apt-get install -y -qq protobuf-compiler libclang-dev clang)
    - rustup component add clippy
  script:
    # Workspace [workspace.lints.clippy] sets production `all = "deny"`.
    # Tests are linted too, but allow test-style unwrap/expect/panic.
    - cargo clippy --workspace -- -A missing-docs
    - cargo clippy --workspace --all-targets -- -A missing-docs -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

cargo-fmt:
  stage: lint
  image: ${AIOS_RUST_CI_IMAGE}
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all -- --check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==========================================================================
# STAGE 4 — BUILD (release binaries, depends on test + lint)
# ==========================================================================
cargo-release:
  stage: build
  image: ${AIOS_RUST_CI_IMAGE}
  # pull-only: re-archiving the multi-GB target/ tree blew the 1h job timeout
  cache:
    key: "${CI_COMMIT_REF_SLUG}-cargo"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  <<: *bootstrap_deps
  needs:
    - cargo-test
    - distro-shell-tests
    - cargo-clippy
    - cargo-fmt
  script:
    - cargo build --release --workspace --locked
  artifacts:
    name: "binaries-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/
    exclude:
      - target/release/deps/
      - target/release/.fingerprint/
      - target/release/build/
      - target/release/examples/
      - target/release/incremental/
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

# ==========================================================================
# STAGE 4B — R13 openSUSE ROOTFS (rootful Docker runner)
# ==========================================================================
r13-opensuse-rootfs:
  stage: build
  image: ${OPENSUSE_CI_IMAGE}
  tags:
    - aios
  timeout: 3h
  needs:
    - distro-shell-tests
  before_script:
    # Stale repo metadata in the leap image → 404 on mirrors; clean first
    - zypper clean -a
    - zypper --non-interactive refresh
    - zypper --non-interactive install --no-recommends gzip tar jq
  script:
    - mkdir -p "$(dirname "${R13_ROOTFS_TARBALL}")"
    - chmod +x distro/build/build-opensuse-rootfs.sh
    - ./distro/build/build-opensuse-rootfs.sh
      --output "${R13_ROOTFS_DIR}"
      --release "${AIOS_OPENSUSE_RELEASE}"
      --arch "${AIOS_OPENSUSE_ARCH}"
      --package-set "${AIOS_OPENSUSE_PACKAGE_SET}"
      --force
    - test -f "${R13_ROOTFS_DIR}/etc/aios/base-rootfs.env"
    - test -f "${R13_ROOTFS_DIR}/etc/aios/base-rootfs.json"
    - tar -C "${R13_ROOTFS_DIR}" --numeric-owner -czf "${R13_ROOTFS_TARBALL}" .
    - ls -lh "${R13_ROOTFS_TARBALL}"
  artifacts:
    name: "r13-rootfs-${CI_COMMIT_SHORT_SHA}-${AIOS_OPENSUSE_ARCH}"
    paths:
      - "${R13_ROOTFS_TARBALL}"
    expire_in: 7 days
  rules:
    - if: '$AIOS_R13_ENTERPRISE_BUILD == "1"'
    # R12.1: rootfs builds automatically on main — assemble-iso consumes it,
    # so the Rev12 ISO is bootable (not scaffold) and the QEMU gate is real.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

# ==========================================================================
# STAGE 5 — ASSEMBLE ISO (main push only)
# ==========================================================================
assemble-iso:
  stage: assemble
  image: ${AIOS_RUST_CI_IMAGE}
  timeout: 3h
  cache:
    key: "${CI_COMMIT_REF_SLUG}-cargo"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  needs:
    - job: cargo-release
      artifacts: true
    - job: r13-opensuse-rootfs
      artifacts: true
  before_script:
    # ISO toolchain + QEMU for the boot gate — the CI image ships none of it.
    # protoc/libclang: the ISO build compiles the workspace + first-boot crate.
    - >
      (command -v xorriso && command -v mksquashfs && command -v qemu-system-x86_64 && command -v protoc && command -v grub-mkrescue) >/dev/null 2>&1 && ldconfig -p | grep -q libclang ||
      (apt-get update -qq && apt-get install -y -qq xorriso squashfs-tools mtools cpio xz-utils dosfstools busybox-static cryptsetup-bin qemu-system-x86 qemu-utils protobuf-compiler libclang-dev clang grub-common grub-pc-bin grub-efi-amd64-bin ovmf)
    - xorriso -version | head -1
  script:
    - chmod +x distro/build/build-aios-iso.sh distro/build/qemu-boot-smoke.sh
    # R12.1: unpack the openSUSE rootfs artifact — the ISO must be bootable, not scaffold
    - export AIOS_BASE_ROOTFS="${AIOS_BASE_ROOTFS:-${R13_ROOTFS_DIR}}"
    - |
      if [ ! -d "${AIOS_BASE_ROOTFS}" ] && [ -f "${R13_ROOTFS_TARBALL}" ]; then
        mkdir -p "${AIOS_BASE_ROOTFS}"
        tar -C "${AIOS_BASE_ROOTFS}" -xzf "${R13_ROOTFS_TARBALL}"
      fi
    - 'test -d "${AIOS_BASE_ROOTFS}" || { echo "ERROR: no base rootfs — refusing to ship a scaffold ISO"; exit 1; }'
    - |
      ISO_ARGS="--release --output ${ISO_OUTPUT} --base-rootfs ${AIOS_BASE_ROOTFS}"
      if [ "${AIOS_ENTERPRISE_RELEASE:-0}" = "1" ]; then
        ISO_ARGS="${ISO_ARGS} --enterprise-release"
      fi
      ./distro/build/build-aios-iso.sh ${ISO_ARGS}
    # R12.7: QEMU live boot gate — blocking, on by default (KVM device from runner)
    - |
      if [ "${AIOS_QEMU_BOOT_TEST:-1}" = "1" ]; then
        QEMU_FLAGS=""
        [ -r /dev/kvm ] && [ -w /dev/kvm ] && QEMU_FLAGS="--kvm"
        ./distro/build/qemu-boot-smoke.sh --iso "${ISO_OUTPUT}" ${QEMU_FLAGS} --require-health --timeout "${AIOS_QEMU_BOOT_TIMEOUT:-300}"
      else
        echo "QEMU boot smoke explicitly disabled (AIOS_QEMU_BOOT_TEST=0)."
      fi
    - ls -lh "${ISO_OUTPUT}"
  artifacts:
    # when: always — a FAILED boot gate must still ship the serial log,
    # otherwise the rescue-drop cause is undiagnosable
    when: always
    name: "${ISO_NAME}"
    paths:
      - "${ISO_OUTPUT}"
      - distro/build/out/qemu-boot-smoke.log
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

# ==========================================================================
# STAGE 6 — VERIFY: QEMU INSTALL GATE (R12.2 acceptance: install to blank
# virtual disk + boot the installed system). allow_failure until the harness
# has one proven green run, then flip to blocking.
# ==========================================================================
qemu-install-gate:
  stage: verify
  image: ${AIOS_RUST_CI_IMAGE}
  timeout: 2h
  allow_failure: true
  needs:
    - job: assemble-iso
      artifacts: true
  before_script:
    - >
      command -v qemu-system-x86_64 >/dev/null 2>&1 && command -v swtpm >/dev/null 2>&1 ||
      (apt-get update -qq && apt-get install -y -qq qemu-system-x86 qemu-utils ovmf swtpm xorriso)
  script:
    - chmod +x distro/build/qemu-install-test.sh
    # Extract live kernel/initrd from the ISO for direct-kernel autoinstall boot
    - mkdir -p distro/build/out/iso-extract
    - xorriso -osirrox on -indev "${ISO_OUTPUT}" -extract /live/vmlinuz distro/build/out/iso-extract/vmlinuz -extract /live/initrd.img distro/build/out/iso-extract/initrd.img
    - |
      QEMU_FLAGS=""
      [ -r /dev/kvm ] && [ -w /dev/kvm ] && QEMU_FLAGS="--kvm"
      ./distro/build/qemu-install-test.sh --iso "${ISO_OUTPUT}" \
        --kernel distro/build/out/iso-extract/vmlinuz \
        --initrd distro/build/out/iso-extract/initrd.img \
        --swtpm ${QEMU_FLAGS}
  artifacts:
    when: always
    name: "install-gate-logs-${CI_COMMIT_SHORT_SHA}"
    paths:
      - distro/build/out/*.log
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

# ==========================================================================
# STAGE 5B — R13 ENTERPRISE ISO (openSUSE rootfs + release ISO)
# ==========================================================================
r13-enterprise-iso:
  stage: assemble
  image: ${AIOS_RUST_CI_IMAGE}
  tags:
    - aios
  timeout: 4h
  needs:
    - job: cargo-release
      artifacts: true
    - job: r13-opensuse-rootfs
      artifacts: true
  before_script:
    - xorriso -version | head -1
  script:
    - mkdir -p "${R13_ROOTFS_DIR}"
    - tar -xzf "${R13_ROOTFS_TARBALL}" -C "${R13_ROOTFS_DIR}"
    - chmod +x distro/build/build-aios-iso.sh
    - JOBS="$(nproc 2>/dev/null || echo 4)"
    - ./distro/build/build-aios-iso.sh
      --release
      --arch "${AIOS_OPENSUSE_ARCH}"
      --jobs "${JOBS}"
      --base-rootfs "${R13_ROOTFS_DIR}"
      --enterprise-release
      --output "${R13_ISO_OUTPUT}"
    - ls -lh "${R13_ISO_OUTPUT}"
  artifacts:
    name: "${R13_ISO_NAME}"
    paths:
      - "${R13_ISO_OUTPUT}"
    expire_in: 30 days
  rules:
    - if: '$AIOS_R13_ENTERPRISE_BUILD == "1"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false

# ==========================================================================
# STAGE 6 — R13 QEMU BOOT SMOKE
# ==========================================================================
r13-qemu-boot-smoke:
  stage: verify
  image: ${AIOS_RUST_CI_IMAGE}
  tags:
    - aios
  timeout: 30m
  needs:
    - job: r13-enterprise-iso
      artifacts: true
  before_script:
    - qemu-system-x86_64 --version
  script:
    - chmod +x distro/build/qemu-boot-smoke.sh
    - ./distro/build/qemu-boot-smoke.sh --iso "${R13_ISO_OUTPUT}" --timeout "${AIOS_QEMU_BOOT_TIMEOUT:-180}"
  artifacts:
    when: always
    name: "r13-qemu-smoke-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "distro/build/out/qemu-boot-smoke.log"
    expire_in: 14 days
  rules:
    - if: '$AIOS_R13_ENTERPRISE_BUILD == "1" && $AIOS_R13_QEMU_BOOT_TEST == "1"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false

# ==========================================================================
# WEEKLY FULL BUILD (scheduled pipeline only)
# ==========================================================================
weekly-full-build:
  stage: assemble
  image: ${AIOS_RUST_CI_IMAGE}
  needs: []
  before_script:
    - rustc --version
    - xorriso -version | head -1
  script:
    - chmod +x distro/build/build-aios-iso.sh distro/build/build-opensuse-rootfs.sh
    - cargo build --release --workspace --locked
    - cargo test --workspace --no-fail-fast
    - |
      if [ -z "${AIOS_BASE_ROOTFS:-}" ] && [ "${AIOS_BUILD_OPENSUSE_ROOTFS:-0}" = "1" ]; then
        export AIOS_BASE_ROOTFS="distro/build/out/rootfs-opensuse-leap-${AIOS_OPENSUSE_RELEASE:-16.0}-${AIOS_OPENSUSE_ARCH:-x86_64}"
        ./distro/build/build-opensuse-rootfs.sh \
          --output "${AIOS_BASE_ROOTFS}" \
          --release "${AIOS_OPENSUSE_RELEASE:-16.0}" \
          --arch "${AIOS_OPENSUSE_ARCH:-x86_64}" \
          --package-set "${AIOS_OPENSUSE_PACKAGE_SET:-server}"
      fi
      if [ -n "${AIOS_BASE_ROOTFS:-}" ]; then
        ISO_ARGS="--release --output ${ISO_OUTPUT} --base-rootfs ${AIOS_BASE_ROOTFS}"
        if [ "${AIOS_ENTERPRISE_RELEASE:-0}" = "1" ]; then
          ISO_ARGS="${ISO_ARGS} --enterprise-release"
        fi
        ./distro/build/build-aios-iso.sh ${ISO_ARGS}
      else
        echo "WARNING: AIOS_BASE_ROOTFS not set; building scaffold packaging ISO, not a bootable Rev12 release ISO."
        ./distro/build/build-aios-iso.sh --release --output "${ISO_OUTPUT}" --allow-scaffold-rootfs --kernel-firmware-source none
      fi
  artifacts:
    name: "aios-rev12-weekly-${CI_PIPELINE_ID}"
    paths:
      - "distro/build/aios-rev12-*.iso"
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
